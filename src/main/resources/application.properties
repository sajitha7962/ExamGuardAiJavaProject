# ExamGuard AI Application Configuration
spring.application.name=ExamGuard AI
server.port=8080

# Primary Database: Local XAMPP MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/examguard_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA & Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration (Camera capture and evidence)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# JWT Authentication Configuration
examguard.jwt.secret=9a3f8c7b4e2d1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f
examguard.jwt.expiration-ms=86400000

# Storage Paths
examguard.storage.face-templates=./storage/faces
examguard.storage.recordings=./storage/recordings
examguard.storage.evidence=./storage/evidence

# Email Settings (Simulated / SMTP configuration)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.examguard@gmail.com
spring.mail.password=simulated_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/

# Jackson JSON serialization
spring.jackson.serialization.fail-on-empty-beans=false
