<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk & Support – ExamGuard AI</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar">
    <a href="/student-dashboard.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
      ExamGuard AI
    </a>
    <a href="/student-dashboard.html" class="btn btn-warning btn-sm">Dashboard</a>
  </nav>

  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div>
        <div class="sidebar-header" id="user-profile-badge"></div>
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item"><a href="/student-dashboard.html">Dashboard</a></li>
          <li class="sidebar-nav-item"><a href="/available-exams.html">Available Exams</a></li>
          <li class="sidebar-nav-item"><a href="/my-examinations.html">My Examinations</a></li>
          <li class="sidebar-nav-item active"><a href="/student-support.html">Support Helpdesk</a></li>
          <li class="sidebar-nav-item"><a href="/student-profile.html">My Profile</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="header-title">
          <h1>Student Support Helpdesk</h1>
          <p>Raise technical grievances or examination queries directly to the administrator.</p>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h3>Create Support Ticket</h3>
          </div>
          <form id="ticket-form">
            <div class="form-group">
              <label class="form-label" for="subject">Issue Subject</label>
              <input type="text" id="subject" class="form-control" placeholder="e.g. Camera lag during Question 4" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="form-control">
                <option value="TECHNICAL_ISSUE">Technical / WebRTC Issue</option>
                <option value="EXAMINATION_DISCREPANCY">Exam Discrepancy</option>
                <option value="BIOMETRIC_ENROLLMENT">Biometric Face Re-enrollment</option>
                <option value="GENERAL">General Academic Query</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="message">Detailed Description</label>
              <textarea id="message" class="form-control" rows="4" placeholder="Explain the incident with relevant context..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Submit Ticket</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>My Support Tickets</h3>
          </div>
          <div id="tickets-list">
            <p style="color: var(--text-muted);">Loading tickets...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    const user = Session.requireRole('STUDENT');
    if (user) {
      renderNavProfile(user);
      loadTickets();
    }

    async function loadTickets() {
      const container = document.getElementById('tickets-list');
      try {
        const tickets = await apiRequest('/student/support/tickets');
        container.innerHTML = '';
        if (!tickets || tickets.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No open or past tickets found.</p>';
          return;
        }

        tickets.forEach(t => {
          const div = document.createElement('div');
          div.style.padding = '0.85rem 0';
          div.style.borderBottom = '1px solid var(--mint-green)';
          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
              <strong>${t.subject}</strong>
              <span class="badge ${t.status === 'RESOLVED' ? 'badge-mint' : 'badge-yellow'}">${t.status}</span>
            </div>
            <p style="font-size: 0.85rem; margin-bottom: 0.35rem;">${t.message}</p>
            ${t.adminResponse ? `<div class="alert alert-yellow" style="padding: 0.5rem 0.75rem; font-size: 0.82rem; margin: 0;"><strong>Admin:</strong> ${t.adminResponse}</div>` : ''}
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = `<p>${err.message}</p>`;
      }
    }

    document.getElementById('ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiRequest('/student/support/tickets', 'POST', {
          subject: document.getElementById('subject').value.trim(),
          category: document.getElementById('category').value,
          message: document.getElementById('message').value.trim()
        });
        showToast('Ticket submitted successfully!');
        document.getElementById('ticket-form').reset();
        loadTickets();
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
