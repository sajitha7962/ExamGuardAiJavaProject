<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Profile – ExamGuard AI</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar">
    <a href="/professor-dashboard.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
      ExamGuard AI
    </a>
    <a href="/professor-dashboard.html" class="btn btn-warning btn-sm">Dashboard</a>
  </nav>

  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div>
        <div class="sidebar-header" id="user-profile-badge"></div>
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item"><a href="/professor-dashboard.html">Dashboard</a></li>
          <li class="sidebar-nav-item"><a href="/manage-exams.html">Manage Exams</a></li>
          <li class="sidebar-nav-item"><a href="/professor-students.html">My Students</a></li>
          <li class="sidebar-nav-item active"><a href="/professor-profile.html">Faculty Profile</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="header-title">
          <h1>Faculty Profile & Credentials</h1>
          <p>Institutional appointment and evaluation privileges.</p>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h3>Faculty Details</h3>
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.85rem; font-size: 0.95rem;">
            <div><strong>Faculty Name:</strong> <span id="f-name">--</span></div>
            <div><strong>Employee ID:</strong> <span id="f-emp">--</span></div>
            <div><strong>Designation:</strong> <span id="f-desig">--</span></div>
            <div><strong>Department:</strong> <span id="f-dept">--</span></div>
            <div><strong>Approval Status:</strong> <span id="f-status" class="badge badge-mint">APPROVED</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Change Password</h3>
          </div>
          <form id="pwd-form">
            <div class="form-group">
              <label class="form-label" for="cur-pwd">Current Password</label>
              <input type="password" id="cur-pwd" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="new-pwd">New Password</label>
              <input type="password" id="new-pwd" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    const user = Session.requireRole('PROFESSOR');
    if (user) {
      renderNavProfile(user);
      loadProfProfile();
    }

    async function loadProfProfile() {
      try {
        const p = await apiRequest('/professor/profile');
        document.getElementById('f-name').innerText = p.user.fullName;
        document.getElementById('f-emp').innerText = p.employeeId;
        document.getElementById('f-desig').innerText = p.designation;
        document.getElementById('f-dept').innerText = `${p.department.name} (${p.department.code})`;
        document.getElementById('f-status').innerText = p.approvalStatus;
        document.getElementById('f-status').className = p.approvalStatus === 'APPROVED' ? 'badge badge-primary' : 'badge badge-yellow';
      } catch (e) {
        showToast(e.message, true);
      }
    }

    document.getElementById('pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiRequest('/auth/change-password', 'POST', {
          currentPassword: document.getElementById('cur-pwd').value,
          newPassword: document.getElementById('new-pwd').value
        });
        showToast('Password updated successfully!');
        document.getElementById('pwd-form').reset();
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
