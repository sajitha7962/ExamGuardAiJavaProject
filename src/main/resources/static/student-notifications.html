<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – ExamGuard AI</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar">
    <a href="/student-dashboard.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
      ExamGuard AI
    </a>
    <a href="/student-dashboard.html" class="btn btn-warning btn-sm">Dashboard</a>
  </nav>

  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div>
        <div class="sidebar-header" id="user-profile-badge"></div>
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item"><a href="/student-dashboard.html">Dashboard</a></li>
          <li class="sidebar-nav-item"><a href="/available-exams.html">Available Exams</a></li>
          <li class="sidebar-nav-item"><a href="/my-examinations.html">My Examinations</a></li>
          <li class="sidebar-nav-item"><a href="/student-profile.html">My Profile</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="header-title">
          <h1>Notification Center</h1>
          <p>Important examination notices, published results, and faculty updates.</p>
        </div>
        <button class="btn btn-outline btn-sm" onclick="markAllRead()">Mark All Read</button>
      </div>

      <div class="card" id="notif-list">
        <p style="color: var(--text-muted);">Loading notifications...</p>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    const user = Session.requireRole('STUDENT');
    if (user) {
      renderNavProfile(user);
      loadNotifications();
    }

    async function loadNotifications() {
      const container = document.getElementById('notif-list');
      try {
        const notifs = await apiRequest('/common/notifications');
        container.innerHTML = '';
        if (!notifs || notifs.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">You have no notifications at this time.</p>';
          return;
        }

        notifs.forEach(n => {
          const div = document.createElement('div');
          div.style.padding = '1rem';
          div.style.borderBottom = '1px solid var(--mint-green)';
          div.style.backgroundColor = n.read ? 'transparent' : 'var(--mint-green-light)';
          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
              <strong>${n.title}</strong>
              <small style="color: var(--text-muted);">${n.createdAt ? n.createdAt.replace('T', ' ').substring(0, 16) : ''}</small>
            </div>
            <p style="margin: 0; font-size: 0.9rem; color: var(--text-main);">${n.message}</p>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = `<p>${err.message}</p>`;
      }
    }

    async function markAllRead() {
      try {
        await apiRequest('/common/notifications/mark-all-read', 'POST');
        showToast('All notifications marked as read');
        loadNotifications();
      } catch (e) {
        showToast(e.message, true);
      }
    }
  </script>
</body>
</html>
