<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery – ExamGuard AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/index.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
      ExamGuard AI
    </a>
    <ul class="nav-menu">
      <li><a href="/login.html" class="nav-link">Back to Sign In</a></li>
    </ul>
  </nav>

  <div class="auth-container">
    <div class="card" style="box-shadow: var(--shadow-hover);">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge badge-mint" style="margin-bottom: 0.5rem;">PASSWORD ASSISTANCE</span>
        <h2>Reset Your Password</h2>
        <p style="color: var(--text-sub); font-size: 0.9rem;">Enter your verified institutional email address</p>
      </div>

      <div class="alert alert-yellow">
        <strong>Demo Security Notice:</strong> In this college test environment, password reset codes are simulated directly for authorized demo users.
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input type="email" id="email" class="form-control" placeholder="user@examguard.edu" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1rem;">
          Send Reset Link & OTP
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Remember your password? <a href="/login.html" style="font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Password reset instructions and OTP sent to email.');
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 2000);
    });
  </script>
</body>
</html>
