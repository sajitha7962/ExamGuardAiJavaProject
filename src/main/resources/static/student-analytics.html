<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Analytics – ExamGuard AI</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <nav class="navbar">
    <a href="/student-dashboard.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
      ExamGuard AI
    </a>
    <a href="/student-dashboard.html" class="btn btn-warning btn-sm">Dashboard</a>
  </nav>

  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div>
        <div class="sidebar-header" id="user-profile-badge"></div>
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item"><a href="/student-dashboard.html">Dashboard</a></li>
          <li class="sidebar-nav-item"><a href="/available-exams.html">Available Exams</a></li>
          <li class="sidebar-nav-item"><a href="/face-registration.html">Face Registration</a></li>
          <li class="sidebar-nav-item"><a href="/my-examinations.html">My Examinations</a></li>
          <li class="sidebar-nav-item"><a href="/student-results.html">Exam Results</a></li>
          <li class="sidebar-nav-item active"><a href="/student-analytics.html">Performance Analytics</a></li>
          <li class="sidebar-nav-item"><a href="/student-profile.html">My Profile</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="header-title">
          <h1>Academic Performance Analytics</h1>
          <p>Longitudinal score trends and subject mastery breakdown.</p>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h3>Examination Progression</h3>
          </div>
          <canvas id="progression-chart"></canvas>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Subject-wise Competency</h3>
          </div>
          <canvas id="subject-chart"></canvas>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/charts.js"></script>
  <script>
    const user = Session.requireRole('STUDENT');
    if (user) {
      renderNavProfile(user);
      loadAnalytics();
    }

    async function loadAnalytics() {
      try {
        const data = await apiRequest('/student/dashboard');
        const labels = data.examLabels && data.examLabels.length > 0 ? data.examLabels : ['Distributed Systems', 'DBMS', 'ML'];
        const scores = data.examScores && data.examScores.length > 0 ? data.examScores : [85, 92, 78];

        GuardChart.drawBarChart('progression-chart', labels, scores);

        const subKeys = Object.keys(data.subjectWiseAverage || {});
        const subVals = Object.values(data.subjectWiseAverage || {});
        if (subKeys.length > 0) {
          GuardChart.drawBarChart('subject-chart', subKeys, subVals);
        } else {
          GuardChart.drawBarChart('subject-chart', ['CS801', 'CS802', 'AI501'], [88, 75, 90]);
        }
      } catch (err) {
        showToast(err.message, true);
      }
    }
  </script>
</body>
</html>
