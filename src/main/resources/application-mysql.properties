# ExamGuard AI - Dedicated MySQL Configuration Profile
# Activate via: java -jar examguard-ai.jar --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/examguard_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

